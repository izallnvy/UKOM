<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <title>Login - PT Prima Data Mandiri</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Poppins", sans-serif;
        min-height: 100vh;
        background: linear-gradient(135deg, #0a7045, #064d2f);
        position: relative;
        overflow: hidden;
      }

      /* Animated Background */
      .bg-animation {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        z-index: 1;
      }
      .bg-animation span {
        position: absolute;
        display: block;
        width: 20px;
        height: 20px;
        background: rgba(255, 255, 255, 0.1);
        animation: moveStars 25s linear infinite;
        bottom: -150px;
      }
      .bg-animation span:nth-child(1) {
        left: 25%;
        width: 80px;
        height: 80px;
        animation-duration: 20s;
      }
      .bg-animation span:nth-child(2) {
        left: 10%;
        animation-duration: 25s;
      }
      .bg-animation span:nth-child(3) {
        left: 70%;
        animation-duration: 30s;
      }
      .bg-animation span:nth-child(4) {
        left: 40%;
        width: 60px;
        height: 60px;
        animation-duration: 22s;
      }
      @keyframes moveStars {
        0% {
          transform: translateY(0) rotate(0deg);
          opacity: 0;
          border-radius: 0;
        }
        10% {
          opacity: 1;
        }
        90% {
          opacity: 1;
        }
        100% {
          transform: translateY(-1000px) rotate(720deg);
          opacity: 0;
          border-radius: 50%;
        }
      }

      .login-container {
        position: relative;
        z-index: 2;
        min-height: 100vh;
        display: flex;
        align-items: center;
        padding: 2rem 0;
      }
      .login-wrapper {
        background: white;
        border-radius: 25px;
        overflow: hidden;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        max-width: 1000px;
        margin: 0 auto;
        animation: slideUp 0.8s ease;
      }
      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(50px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Left Side */
      .mosque-side {
        background:
          linear-gradient(135deg, rgba(10, 112, 69, 0.9), rgba(6, 77, 47, 0.9)),
          url("https://images.unsplash.com/photo-1564769625905-50e93615e769?w=800")
            center/cover;
        padding: 3rem;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        color: white;
        position: relative;
        overflow: hidden;
      }
      .mosque-content {
        position: relative;
        z-index: 1;
      }
      .mosque-icon {
        font-size: 5rem;
        margin-bottom: 1.5rem;
        animation: float 3s ease-in-out infinite;
      }
      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-20px);
        }
      }

      /* Right Side */
      .form-side {
        padding: 3rem;
      }
      .form-header {
        text-align: center;
        margin-bottom: 2rem;
      }
      .form-header h3 {
        color: #0a7045;
        font-weight: 700;
      }
      .form-control {
        border-radius: 12px;
        border: 2px solid #e2e8f0;
        padding: 0.8rem 1rem;
      }
      .form-control:focus {
        border-color: #0a7045;
        box-shadow: 0 0 0 0.2rem rgba(10, 112, 69, 0.1);
      }
      .input-group-text {
        background: white;
        border: 2px solid #e2e8f0;
        border-left: none;
        border-radius: 0 12px 12px 0;
        cursor: pointer;
      }
      .input-group .form-control {
        border-right: none;
        border-radius: 12px 0 0 12px;
      }

      .btn-login {
        background: linear-gradient(135deg, #0a7045, #064d2f);
        border: none;
        padding: 0.9rem;
        border-radius: 12px;
        font-weight: 600;
        color: white;
        width: 100%;
        transition: all 0.3s;
      }
      .btn-login:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(10, 112, 69, 0.3);
        color: white;
      }

      .divider {
        display: flex;
        align-items: center;
        text-align: center;
        margin: 1.5rem 0;
        color: #94a3b8;
        font-size: 0.9rem;
      }
      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        border-bottom: 1px solid #e2e8f0;
      }
      .divider span {
        padding: 0 1rem;
      }

      @media (max-width: 768px) {
        .mosque-side {
          display: none;
        }
        .form-side {
          padding: 2rem 1.5rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="bg-animation">
      <span></span><span></span><span></span><span></span><span></span>
    </div>

    <div class="login-container">
      <div class="container">
        <div class="login-wrapper">
          <div class="row g-0">
            <!-- KIRI: GAMBAR Perusahaan -->
            <div class="col-lg-6 mosque-side">
              <div class="mosque-content">
                <i class="bi bi-building mosque-icon"></i>
                <h2>PT Prima Data Mandiri</h2>
                <p>
                  Sistem Informasi Manajemen Perusahaan<br />Taman Lanrean
                  Indah, Makassar
                </p>
              </div>
            </div>

            <!-- KANAN: FORM LOGIN -->
            <div class="col-lg-6 form-side">
              <div class="form-header">
                <h3>Selamat Datang</h3>
                <p>Silakan login untuk mengakses sistem</p>
              </div>

              <!-- Alert Error (Disembunyikan secara default) -->
              <div
                id="error-alert"
                class="alert alert-danger"
                style="display: none; border-radius: 12px"
              >
                <i class="bi bi-exclamation-circle me-2"></i> Username atau
                Password salah! (Gunakan admin / 123456)
              </div>

              <!-- FORM (Tanpa PHP, Ditangani dengan Javascript) -->
              <form id="loginForm" onsubmit="prosesLogin(event)">
                <div class="mb-3">
                  <label class="form-label fw-bold text-secondary"
                    ><i class="bi bi-person me-1"></i> Username</label
                  >
                  <input
                    type="text"
                    id="username"
                    class="form-control"
                    placeholder="Masukkan username"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label class="form-label fw-bold text-secondary"
                    ><i class="bi bi-lock me-1"></i> Password</label
                  >
                  <div class="input-group">
                    <input
                      type="password"
                      id="password"
                      class="form-control"
                      placeholder="Masukkan password"
                      required
                    />
                    <span class="input-group-text" onclick="togglePass()">
                      <i id="eye-icon" class="bi bi-eye"></i>
                    </span>
                  </div>
                </div>

                <button type="submit" class="btn btn-login">
                  <i class="bi bi-box-arrow-in-right me-2"></i> Login
                </button>
              </form>

              <div class="divider">
                <span>Atau</span>
              </div>

              <div class="text-center">
                <!-- TAUTAN INI TERHUBUNG KE index.html -->
                <a
                  href="index.html"
                  class="btn btn-outline-success w-100"
                  style="border-radius: 12px; padding: 0.9rem"
                >
                  <i class="bi bi-house me-2"></i> Kembali ke Beranda
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      // Menampilkan atau menyembunyikan password
      function togglePass() {
        const input = document.getElementById("password");
        const icon = document.getElementById("eye-icon");
        if (input.type === "password") {
          input.type = "text";
          icon.classList.replace("bi-eye", "bi-eye-slash");
        } else {
          input.type = "password";
          icon.classList.replace("bi-eye-slash", "bi-eye");
        }
      }

      // Proses Login Statis (Javascript)
      function prosesLogin(e) {
        e.preventDefault(); // Mencegah halaman refresh

        const user = document.getElementById("username").value;
        const pass = document.getElementById("password").value;
        const alertBox = document.getElementById("error-alert");

        // Validasi Login Dummy
        if (user === "admin" && pass === "123456") {
          alertBox.style.display = "none";
          alert("Berhasil Login! Mengarahkan ke Halaman Utama...");

          // Redirect ke halaman index.html
          window.location.href = "index.html";
        } else {
          // Tampilkan pesan error jika salah
          alertBox.style.display = "block";

          // Hilangkan error setelah 3 detik
          setTimeout(() => {
            alertBox.style.display = "none";
          }, 3000);
        }
      }
    </script>
  </body>
</html>
